<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaVault - Creator Media Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #060911; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 50%, #818cf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Header Navigation -->
    <header class="p-5 border-b border-slate-800/80 glass-panel sticky top-0 z-30">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <!-- Brand & Title at Top -->
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-teal-500 to-cyan-500 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-teal-500/20">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <h1 class="font-extrabold text-xl tracking-tight gradient-text">MediaVault</h1>
                    <p class="text-[11px] text-slate-400 font-medium">Digital Media Portal</p>
                </div>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex items-center gap-3">
                <a href="login.html" class="px-4 py-2 text-xs font-bold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 transition-all">
                    Sign In
                </a>
                <a href="register.html" class="px-5 py-2 text-xs font-bold text-slate-950 bg-gradient-to-r from-teal-400 to-cyan-400 hover:from-teal-300 hover:to-cyan-300 rounded-xl shadow-lg shadow-teal-500/20 transition-all">
                    Create Account
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-4xl mx-auto px-4 py-8 space-y-8 flex-1 w-full flex flex-col justify-center">
        
        <!-- Main Webpage Title at Top -->
        <div class="text-center space-y-2">
            <h2 class="text-3xl md:text-4xl font-black text-slate-100 leading-tight tracking-tight">
                Media Management & <span class="gradient-text">Creator Portal</span>
            </h2>
        </div>

        <!-- Embedded YouTube Video Container (Loaded Live from Firebase RTDB) -->
        <div class="glass-panel p-3 md:p-5 rounded-3xl border border-slate-800 shadow-2xl space-y-3">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3 px-2">
                <div class="flex items-center gap-2">
                    <i class="fa-brands fa-youtube text-red-500 text-lg"></i>
                    <span class="text-xs font-bold text-slate-200">Featured Media Walkthrough</span>
                </div>
                <span id="videoStatus" class="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">Loading Video...</span>
            </div>

            <!-- Responsive Video Frame -->
            <div class="relative w-full aspect-video rounded-2xl overflow-hidden bg-slate-950 border border-slate-800 shadow-inner">
                <iframe 
                    id="youtubeFrame"
                    class="w-full h-full"
                    src="https://www.youtube.com/embed/5qap5aO4i9A" 
                    title="Media Vault Video Player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex flex-wrap justify-center items-center gap-4 pt-2">
            <a href="register.html" class="px-8 py-3.5 bg-gradient-to-r from-teal-400 to-cyan-400 hover:from-teal-300 hover:to-cyan-300 text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-teal-500/20 transition-all flex items-center gap-2">
                <i class="fa-solid fa-user-plus"></i>
                <span>Create Account</span>
            </a>
            <a href="login.html" class="px-8 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-sm rounded-xl border border-slate-700 transition-all flex items-center gap-2">
                <i class="fa-solid fa-right-to-bracket"></i>
                <span>Sign In</span>
            </a>
        </div>

    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-xs text-slate-500 border-t border-slate-800/80">
        &copy; MediaVault System. Digital Media Management Platform.
    </footer>

    <!-- Firebase SDK & Realtime Database Loader -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js";

        // Your provided Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAErSTm1Pa6Ey4cB6gKvm1JFUwOAtR72zs",
            authDomain: "students-de059.firebaseapp.com",
            databaseURL: "https://students-de059-default-rtdb.firebaseio.com",
            projectId: "students-de059",
            storageBucket: "students-de059.firebasestorage.app",
            messagingSenderId: "411149656460",
            appId: "1:411149656460:web:41d417ec363631ffac76a9",
            measurementId: "G-H6R17PPP8R"
        };

        // Initialize Firebase & Realtime Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Utility: Convert YouTube link formats into an embed URL
        function parseYouTubeEmbedUrl(inputUrl) {
            if (!inputUrl) return null;
            
            // Extract Video ID using regex (supports youtube.com/watch?v=, youtu.be/, shorts/, embed/)
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = inputUrl.match(regExp);

            if (match && match[2].length === 11) {
                return `https://www.youtube.com/embed/${match[2]}`;
            }
            
            // If raw ID was stored directly
            if (inputUrl.length === 11 && !inputUrl.includes('/')) {
                return `https://www.youtube.com/embed/${inputUrl}`;
            }

            return inputUrl; // Return unchanged if already embed URL
        }

        // Realtime Listener for Admin YouTube Link (`settings/youtube_url`)
        const videoRef = ref(db, 'settings/youtube_url');
        const statusBadge = document.getElementById('videoStatus');
        const iframe = document.getElementById('youtubeFrame');

        onValue(videoRef, (snapshot) => {
            const rawUrl = snapshot.val();
            if (rawUrl) {
                const embedUrl = parseYouTubeEmbedUrl(rawUrl);
                iframe.src = embedUrl;
                statusBadge.innerText = "Live Stream";
                statusBadge.className = "text-[10px] px-2 py-0.5 rounded-full bg-teal-500/10 text-teal-400 border border-teal-500/30";
            } else {
                statusBadge.innerText = "Default Video";
            }
        }, (error) => {
            console.warn("Could not load dynamic video URL from Firebase, using default fallback.", error);
            statusBadge.innerText = "Default Video";
        });
    </script>

</body>
</html>
