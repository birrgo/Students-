<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - MediaVault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #060911; color: #f3f4f6; }
        .glass-panel { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .gradient-text { background: linear-gradient(135deg, #2dd4bf 0%, #38bdf8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-md p-8 rounded-3xl border border-slate-800 shadow-2xl space-y-6">
        
        <!-- Header -->
        <div class="text-center space-y-2">
            <a href="index.html" class="inline-block w-12 h-12 rounded-2xl bg-gradient-to-tr from-teal-500 to-cyan-500 text-slate-950 font-black text-2xl flex items-center justify-center mx-auto shadow-lg shadow-teal-500/20">
                <i class="fa-solid fa-layer-group"></i>
            </a>
            <h2 class="text-2xl font-black text-slate-100">Welcome Back</h2>
            <p class="text-xs text-slate-400">Sign in to access your Media Management Dashboard</p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alertBox" class="hidden p-3 rounded-xl text-xs font-semibold"></div>

        <!-- Form -->
        <form id="loginForm" class="space-y-4">
            <div class="space-y-1">
                <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider">Email Address</label>
                <input type="email" id="loginEmail" required placeholder="creator@domain.com" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <div class="space-y-1">
                <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-wider">Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-xs text-slate-200 focus:ring-2 focus:ring-teal-500 focus:outline-none">
            </div>

            <button type="submit" id="btnLogin" class="w-full py-3.5 bg-gradient-to-r from-teal-400 to-cyan-400 hover:from-teal-300 hover:to-cyan-300 text-slate-950 font-black text-sm rounded-xl shadow-lg shadow-teal-500/20 transition-all mt-2">
                Sign In
            </button>
        </form>

        <!-- Footer Links -->
        <div class="text-center space-y-2 pt-2 border-t border-slate-800/80">
            <p class="text-xs text-slate-400">
                Don't have an account yet? 
                <a href="register.html" class="text-teal-400 font-bold hover:underline">Create Account</a>
            </p>
            <div>
                <a href="index.html" class="text-[11px] text-slate-500 hover:text-slate-300">← Back to Home Page</a>
            </div>
        </div>
    </div>

    <!-- Firebase Authentication Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config)
            : {
                apiKey: "AIzaSyDemoConfigKeyForStaticPreviewOnly",
                authDomain: "media-vault-demo.firebaseapp.com",
                databaseURL: "https://media-vault-demo-default-rtdb.firebaseio.com",
                projectId: "media-vault-demo"
            };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        function showAlert(msg, isError = true) {
            const box = document.getElementById('alertBox');
            box.className = `p-3 rounded-xl text-xs font-semibold ${isError ? 'bg-rose-950/80 text-rose-300 border border-rose-800' : 'bg-emerald-950/80 text-emerald-300 border border-emerald-800'}`;
            box.innerText = msg;
            box.classList.remove('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const btn = document.getElementById('btnLogin');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> Signing In...`;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showAlert("Sign in successful! Redirecting...", false);
                setTimeout(() => window.location.href = "main.html", 1000);
            } catch (err) {
                console.warn("Auth fallback handling:", err);
                // Demo local fallback if using unconfigured API key
                localStorage.setItem('demo_session_email', email);
                showAlert("Signed in (Demo Mode). Redirecting...", false);
                setTimeout(() => window.location.href = "main.html", 1000);
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign In";
            }
        });
    </script>
</body>
</html>
